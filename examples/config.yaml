firefighting:
  hazard_level: "light"
  steel:
    material: "seamless"
    schedule: "40"
    specs: "ASTM"
    connnection_type: 
      "1": "Threaded"
      "1.25": "Threaded"
      "1.5": "Threaded"
      "2": "Threaded"
      "2.5": "Welded"
      "3": "Welded"
      "4": "Welded"
      "6": "Welded"

preproessing:
  root_flow_route: "continuation"

processing:
  compute_pipe_dimensions: true

geometry:
  welded_connection:
    enabled: true
    min_main_pipe_diameter: "2"

autocad:
  input:
    drawing:
      units: "m"
    xdata:
      application_name: "FIREPLANNER"
      fields:
        elevation: "cop"
    root_line_identifier: 
      color: "red"
    line_network_layer:
      name: "line-network"
    sprinkler_blocks:
      SPR:
        temperature: 68
        k_factor: 5.6 
  output:
    network:
      layers:
        line:
          name: "ff-sprinklers"
          properties:
            color: "green"
            line_weight: 0.13
        centerline:
          enabled: true
          name: "ff-sprinklers-thin"
          properties:
            color: "gray"
            line_weight: 0.05
boq:
  output:
    excel:
      enabled: true
      path: "boq_report.xlsx"
    console:
      enabled: true
  paint:
    thickness: 140
    scrap_precentage: 0.4
    volume_solids_precentage: 0.75
