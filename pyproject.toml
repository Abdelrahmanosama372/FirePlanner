[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fireplanner"
version = "0.1.0"
description = "Water FireFighting Planner System"
dependencies = [
    "pyautocad",
    "numpy",
    "openpyxl",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock", 
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "7.0"
addopts = ["-ra"]
testpaths = [
    "tests",
    "integration",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportImplicitAbstractClass = "error"
executionEnvironments = [
  { root = ".", extraPaths = ["src"] },
]
